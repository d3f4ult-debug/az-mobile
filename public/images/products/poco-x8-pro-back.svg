<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <linearGradient id="poco-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="poco-visor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="poco-lens" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="52" y="32" width="296" height="636" rx="42" fill="#18181b" filter="url(#shadow)"/>

  <!-- Back Panel (POCO Yellow) -->
  <rect x="56" y="36" width="288" height="628" rx="38" fill="url(#poco-yellow)"/>

  <!-- Subtle Carbon Fiber / High-tech Pattern Stripes on Lower Back -->
  <path d="M 56,420 L 344,420 L 344,424 L 56,424 Z" fill="#ca8a04" opacity="0.3"/>
  <path d="M 56,440 L 344,440 L 344,444 L 56,444 Z" fill="#ca8a04" opacity="0.3"/>
  <path d="M 56,460 L 344,460 L 344,464 L 56,464 Z" fill="#ca8a04" opacity="0.3"/>

  <!-- Big Horizontal Camera Island (Signature POCO Design) -->
  <rect x="66" y="56" width="268" height="150" rx="20" fill="url(#poco-visor)" stroke="#27272a" stroke-width="2"/>

  <!-- Left Camera 2x2 Cluster -->
  <!-- Top Left Lens -->
  <g transform="translate(86, 74)">
    <circle cx="26" cy="26" r="24" fill="#09090b" stroke="#3f3f46" stroke-width="2"/>
    <circle cx="26" cy="26" r="18" fill="url(#poco-lens)"/>
    <circle cx="21" cy="21" r="5" fill="#ffffff" opacity="0.5"/>
  </g>
  <!-- Top Right Lens -->
  <g transform="translate(144, 74)">
    <circle cx="26" cy="26" r="24" fill="#09090b" stroke="#3f3f46" stroke-width="2"/>
    <circle cx="26" cy="26" r="18" fill="url(#poco-lens)"/>
    <circle cx="21" cy="21" r="5" fill="#ffffff" opacity="0.5"/>
  </g>
  <!-- Bottom Left Lens -->
  <g transform="translate(86, 132)">
    <circle cx="26" cy="26" r="24" fill="#09090b" stroke="#3f3f46" stroke-width="2"/>
    <circle cx="26" cy="26" r="18" fill="url(#poco-lens)"/>
    <circle cx="21" cy="21" r="5" fill="#ffffff" opacity="0.5"/>
  </g>
  <!-- Flash & Sensor -->
  <g transform="translate(144, 132)">
    <circle cx="26" cy="26" r="20" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="8" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Big Bold POCO Branding in Visor Right Section -->
  <text x="260" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="2">POCO</text>
  <text x="260" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">50MP OIS</text>
</svg>
