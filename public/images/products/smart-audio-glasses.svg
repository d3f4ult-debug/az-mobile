<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="lens-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="polarized-glare" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Temple (Arm) extending back -->
  <path d="M 110,185 Q 70,120 40,80 L 55,75 Q 85,115 125,180 Z" fill="#27272a"/>
  <!-- Right Temple (Arm) extending back -->
  <path d="M 490,185 Q 530,120 560,80 L 545,75 Q 515,115 475,180 Z" fill="#27272a"/>

  <!-- Left Frame Outer -->
  <path d="M 100,160 C 100,130 140,135 250,140 C 265,141 270,170 260,240 C 250,290 190,295 140,285 C 105,275 95,210 100,160 Z" fill="url(#frame-grad)" filter="url(#shadow)"/>
  
  <!-- Left Lens -->
  <path d="M 115,165 C 120,145 150,148 235,152 C 250,153 252,175 245,230 C 235,275 185,280 148,272 C 120,265 110,210 115,165 Z" fill="url(#lens-dark)"/>
  <path d="M 115,165 C 120,145 150,148 235,152 C 250,153 252,175 245,230 C 235,275 185,280 148,272 C 120,265 110,210 115,165 Z" fill="url(#polarized-glare)"/>
  <!-- Lens reflection highlight -->
  <path d="M 130,160 L 220,165 L 190,260 L 150,260 Z" fill="#ffffff" opacity="0.08"/>

  <!-- Bridge (Middle) -->
  <path d="M 245,165 C 270,150 330,150 355,165 C 345,185 255,185 245,165 Z" fill="url(#frame-grad)"/>

  <!-- Right Frame Outer -->
  <path d="M 500,160 C 500,130 460,135 350,140 C 335,141 330,170 340,240 C 350,290 410,295 460,285 C 495,275 505,210 500,160 Z" fill="url(#frame-grad)" filter="url(#shadow)"/>

  <!-- Right Lens -->
  <path d="M 485,165 C 480,145 450,148 365,152 C 350,153 348,175 355,230 C 365,275 415,280 452,272 C 480,265 490,210 485,165 Z" fill="url(#lens-dark)"/>
  <path d="M 485,165 C 480,145 450,148 365,152 C 350,153 348,175 355,230 C 365,275 415,280 452,272 C 480,265 490,210 485,165 Z" fill="url(#polarized-glare)"/>
  <!-- Lens reflection highlight -->
  <path d="M 470,160 L 380,165 L 410,260 L 450,260 Z" fill="#ffffff" opacity="0.08"/>

  <!-- Smart Audio Speaker Micro-grilles on temples -->
  <g transform="translate(100, 185)">
    <circle cx="0" cy="0" r="2.5" fill="#52525b"/>
    <circle cx="6" cy="0" r="2.5" fill="#52525b"/>
    <circle cx="12" cy="0" r="2.5" fill="#52525b"/>
  </g>
  <g transform="translate(488, 185)">
    <circle cx="0" cy="0" r="2.5" fill="#52525b"/>
    <circle cx="6" cy="0" r="2.5" fill="#52525b"/>
    <circle cx="12" cy="0" r="2.5" fill="#52525b"/>
  </g>

  <!-- Smart LED indicator / camera on hinge -->
  <circle cx="106" cy="155" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="494" cy="155" r="3" fill="#10b981" opacity="0.8"/>

  <!-- Brand text badge -->
  <text x="300" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#71717a" text-anchor="middle">SMART AUDIO GLASSES</text>
  <text x="300" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="1" fill="#a1a1aa" text-anchor="middle">POLARIZED UV400 • BLUETOOTH 5.4</text>
</svg>
