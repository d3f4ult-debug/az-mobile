<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <!-- Natural Titanium Body Gradient -->
    <linearGradient id="iphone-titanium-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="plateau-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
    <radialGradient id="iphone-lens" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#0369a1" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#09090b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="plateau-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="phone-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Titanium Curved Frame -->
  <rect x="52" y="32" width="296" height="636" rx="44" fill="#374151" filter="url(#phone-shadow)"/>
  
  <!-- Matte Glass Back Finish -->
  <rect x="55" y="35" width="290" height="630" rx="41" fill="url(#iphone-titanium-body)"/>

  <!-- Top-left Camera Plateau (Iconic Squircle) -->
  <rect x="72" y="55" width="136" height="136" rx="32" fill="url(#plateau-grad)" filter="url(#plateau-shadow)"/>

  <!-- Top Left Lens (Main 48MP) -->
  <g transform="translate(86, 70)">
    <circle cx="26" cy="26" r="26" fill="#18181b" stroke="#d4d4d8" stroke-width="2.5"/>
    <circle cx="26" cy="26" r="21" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="15" fill="url(#iphone-lens)"/>
    <circle cx="21" cy="21" r="5" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Bottom Left Lens (Telephoto Periscope) -->
  <g transform="translate(86, 126)">
    <circle cx="26" cy="26" r="26" fill="#18181b" stroke="#d4d4d8" stroke-width="2.5"/>
    <circle cx="26" cy="26" r="21" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="15" fill="url(#iphone-lens)"/>
    <circle cx="21" cy="21" r="5" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Right Middle Lens (Ultra-Wide) -->
  <g transform="translate(142, 98)">
    <circle cx="26" cy="26" r="26" fill="#18181b" stroke="#d4d4d8" stroke-width="2.5"/>
    <circle cx="26" cy="26" r="21" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="15" fill="url(#iphone-lens)"/>
    <circle cx="21" cy="21" r="5" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- True Tone Adaptive Flash -->
  <circle cx="168" cy="74" r="10" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
  <circle cx="168" cy="74" r="6" fill="#fef08a" opacity="0.85"/>

  <!-- LiDAR Scanner Dot -->
  <circle cx="168" cy="154" r="9" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
  <circle cx="168" cy="154" r="7" fill="#18181b"/>

  <!-- Apple Logo in Center -->
  <g transform="translate(182, 330) scale(0.85)">
    <path d="M21.5,15.6 C21.4,12.2 24.2,10.4 24.3,10.3 C22.7,8 20.2,7.7 19.3,7.6 C17.2,7.4 15.1,8.9 14,8.9 C12.9,8.9 11.2,7.6 9.5,7.6 C7.2,7.6 5.1,8.9 4,10.8 C1.6,14.8 3.4,20.8 5.7,24 C6.9,25.6 8.2,27.3 10,27.3 C11.8,27.2 12.5,26.2 14.6,26.2 C16.7,26.2 17.3,27.3 19.1,27.2 C21,27.2 22.1,25.6 23.3,24 C24.6,22.1 25.1,20.3 25.2,20.2 C25.1,20.1 21.6,18.8 21.5,15.6 Z" fill="#27272a" opacity="0.75"/>
    <path d="M17.8,5.1 C18.7,4 19.3,2.4 19.1,0.8 C17.7,0.9 16,1.7 15.1,2.8 C14.3,3.7 13.6,5.3 13.8,6.9 C15.4,7 17,6.1 17.8,5.1 Z" fill="#27272a" opacity="0.75"/>
  </g>
</svg>
