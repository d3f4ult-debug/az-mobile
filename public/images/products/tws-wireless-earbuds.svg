<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="earbud-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="case-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Charging Case Open Base -->
  <g filter="url(#shadow)">
    <!-- Main Case Body -->
    <rect x="130" y="220" width="240" height="200" rx="60" fill="url(#case-body)" stroke="#e4e4e7" stroke-width="2"/>
    <!-- LED Indicator -->
    <circle cx="250" cy="310" r="4" fill="#22c55e"/>
    <!-- Chrome Trim / Seam -->
    <path d="M 130,225 Q 250,240 370,225" stroke="#d4d4d8" stroke-width="2" fill="none"/>
    <!-- Left Chamber Interior -->
    <ellipse cx="190" cy="225" rx="35" ry="15" fill="#27272a"/>
    <!-- Right Chamber Interior -->
    <ellipse cx="310" cy="225" rx="35" ry="15" fill="#27272a"/>
  </g>

  <!-- Left Earbud (Floating) -->
  <g transform="translate(170, 70)" filter="url(#shadow)">
    <!-- Stem -->
    <rect x="-10" y="55" width="20" height="75" rx="10" fill="url(#earbud-white)" stroke="#e4e4e7" stroke-width="1"/>
    <!-- Chrome Charging Contact -->
    <rect x="-9" y="122" width="18" height="8" rx="4" fill="#a1a1aa"/>
    <!-- Main Acoustic Head -->
    <ellipse cx="-12" cy="50" rx="32" ry="26" fill="url(#earbud-white)" stroke="#e4e4e7" stroke-width="1"/>
    <!-- Silicone In-ear Tip -->
    <ellipse cx="-34" cy="50" rx="14" ry="20" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/>
    <!-- Black Acoustic Vent / Grille -->
    <ellipse cx="4" cy="42" rx="6" ry="10" fill="#18181b"/>
  </g>

  <!-- Right Earbud (Floating) -->
  <g transform="translate(330, 70)" filter="url(#shadow)">
    <!-- Stem -->
    <rect x="-10" y="55" width="20" height="75" rx="10" fill="url(#earbud-white)" stroke="#e4e4e7" stroke-width="1"/>
    <!-- Chrome Charging Contact -->
    <rect x="-9" y="122" width="18" height="8" rx="4" fill="#a1a1aa"/>
    <!-- Main Acoustic Head -->
    <ellipse cx="12" cy="50" rx="32" ry="26" fill="url(#earbud-white)" stroke="#e4e4e7" stroke-width="1"/>
    <!-- Silicone In-ear Tip -->
    <ellipse cx="34" cy="50" rx="14" ry="20" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/>
    <!-- Black Acoustic Vent / Grille -->
    <ellipse cx="-4" cy="42" rx="6" ry="10" fill="#18181b"/>
  </g>

  <!-- Bonus Gift Tag Floating Ribbon -->
  <g transform="translate(350, 200)">
    <rect x="0" y="0" width="120" height="34" rx="8" fill="#e11d48" filter="url(#shadow)"/>
    <text x="60" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">🎁 SOVG&apos;A BONUS</text>
  </g>

  <!-- Product Caption -->
  <text x="250" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#71717a" text-anchor="middle">TWS WIRELESS BLUETOOTH EARBUDS</text>
</svg>
