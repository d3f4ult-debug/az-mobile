<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <linearGradient id="ultramarine-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="island-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <radialGradient id="iphone-lens-blue" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#1d4ed8" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#020617"/>
    </radialGradient>
    <filter id="phone-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="52" y="32" width="296" height="636" rx="44" fill="#1e3a8a" filter="url(#phone-shadow)"/>
  <rect x="55" y="35" width="290" height="630" rx="41" fill="url(#ultramarine-body)"/>

  <!-- Vertical Dual Camera Island -->
  <rect x="75" y="58" width="68" height="136" rx="34" fill="url(#island-grad)" stroke="#93c5fd" stroke-width="1.5" opacity="0.95"/>

  <!-- Top Lens -->
  <g transform="translate(82, 65)">
    <circle cx="27" cy="27" r="25" fill="#172554" stroke="#bfdbfe" stroke-width="2.5"/>
    <circle cx="27" cy="27" r="16" fill="url(#iphone-lens-blue)"/>
    <circle cx="22" cy="22" r="5" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Bottom Lens -->
  <g transform="translate(82, 133)">
    <circle cx="27" cy="27" r="25" fill="#172554" stroke="#bfdbfe" stroke-width="2.5"/>
    <circle cx="27" cy="27" r="16" fill="url(#iphone-lens-blue)"/>
    <circle cx="22" cy="22" r="5" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Flash -->
  <circle cx="165" cy="126" r="10" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="165" cy="126" r="6" fill="#fef08a"/>

  <!-- Apple Logo in Center -->
  <g transform="translate(182, 330) scale(0.85)">
    <path d="M21.5,15.6 C21.4,12.2 24.2,10.4 24.3,10.3 C22.7,8 20.2,7.7 19.3,7.6 C17.2,7.4 15.1,8.9 14,8.9 C12.9,8.9 11.2,7.6 9.5,7.6 C7.2,7.6 5.1,8.9 4,10.8 C1.6,14.8 3.4,20.8 5.7,24 C6.9,25.6 8.2,27.3 10,27.3 C11.8,27.2 12.5,26.2 14.6,26.2 C16.7,26.2 17.3,27.3 19.1,27.2 C21,27.2 22.1,25.6 23.3,24 C24.6,22.1 25.1,20.3 25.2,20.2 C25.1,20.1 21.6,18.8 21.5,15.6 Z" fill="#172554" opacity="0.5"/>
    <path d="M17.8,5.1 C18.7,4 19.3,2.4 19.1,0.8 C17.7,0.9 16,1.7 15.1,2.8 C14.3,3.7 13.6,5.3 13.8,6.9 C15.4,7 17,6.1 17.8,5.1 Z" fill="#172554" opacity="0.5"/>
  </g>
</svg>
