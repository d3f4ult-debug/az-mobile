<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="binoc-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="30%" stop-color="#292524"/>
      <stop offset="70%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="armor-rubber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="ruby-lens" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#9f1239" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Eyepiece (Top Left) -->
  <rect x="180" y="30" width="60" height="50" rx="8" fill="#18181b" stroke="#44403c" stroke-width="2"/>
  <rect x="175" y="25" width="70" height="15" rx="5" fill="#09090b"/>
  <!-- Right Eyepiece (Top Right) -->
  <rect x="360" y="30" width="60" height="50" rx="8" fill="#18181b" stroke="#44403c" stroke-width="2"/>
  <rect x="355" y="25" width="70" height="15" rx="5" fill="#09090b"/>

  <!-- Center Focusing Wheel Axis & Cylinder -->
  <rect x="285" y="70" width="30" height="180" rx="6" fill="#0c0a09" stroke="#57534e" stroke-width="2"/>
  <!-- Center Focusing Wheel Ridges -->
  <rect x="280" y="90" width="40" height="45" rx="6" fill="#292524" stroke="#78716c" stroke-width="2"/>
  <line x1="280" y1="100" x2="320" y2="100" stroke="#0c0a09" stroke-width="2"/>
  <line x1="280" y1="110" x2="320" y2="110" stroke="#0c0a09" stroke-width="2"/>
  <line x1="280" y1="120" x2="320" y2="120" stroke="#0c0a09" stroke-width="2"/>

  <!-- Left Prism Housing & Main Barrel -->
  <g transform="translate(0, 0)" filter="url(#shadow)">
    <!-- Upper body prism section -->
    <path d="M 160,80 L 250,80 L 265,220 L 140,220 Z" fill="url(#armor-rubber)"/>
    <!-- Lower barrel tube -->
    <path d="M 140,220 L 265,220 L 275,370 L 125,370 Z" fill="url(#binoc-body)"/>
    <!-- Tactile rubber grip strips -->
    <rect x="135" y="235" width="20" height="90" rx="4" fill="#0c0a09" opacity="0.6"/>
    <rect x="135" y="245" width="16" height="4" fill="#44403c"/>
    <rect x="135" y="260" width="16" height="4" fill="#44403c"/>
    <rect x="135" y="275" width="16" height="4" fill="#44403c"/>
    <rect x="135" y="290" width="16" height="4" fill="#44403c"/>
    <rect x="135" y="305" width="16" height="4" fill="#44403c"/>

    <!-- Left Objective Lens Outer Ring -->
    <ellipse cx="200" cy="370" rx="75" ry="35" fill="#0c0a09" stroke="#57534e" stroke-width="3"/>
    <!-- Left Multi-coated Ruby / Emerald Lens Glass -->
    <ellipse cx="200" cy="370" rx="64" ry="28" fill="url(#ruby-lens)"/>
    <ellipse cx="190" cy="365" rx="18" ry="7" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Right Prism Housing & Main Barrel -->
  <g transform="translate(0, 0)" filter="url(#shadow)">
    <!-- Upper body prism section -->
    <path d="M 440,80 L 350,80 L 335,220 L 460,220 Z" fill="url(#armor-rubber)"/>
    <!-- Lower barrel tube -->
    <path d="M 460,220 L 335,220 L 325,370 L 475,370 Z" fill="url(#binoc-body)"/>
    <!-- Tactile rubber grip strips -->
    <rect x="445" y="235" width="20" height="90" rx="4" fill="#0c0a09" opacity="0.6"/>
    <rect x="445" y="245" width="16" height="4" fill="#44403c"/>
    <rect x="445" y="260" width="16" height="4" fill="#44403c"/>
    <rect x="445" y="275" width="16" height="4" fill="#44403c"/>
    <rect x="445" y="290" width="16" height="4" fill="#44403c"/>
    <rect x="445" y="305" width="16" height="4" fill="#44403c"/>

    <!-- Right Objective Lens Outer Ring -->
    <ellipse cx="400" cy="370" rx="75" ry="35" fill="#0c0a09" stroke="#57534e" stroke-width="3"/>
    <!-- Right Multi-coated Ruby / Emerald Lens Glass -->
    <ellipse cx="400" cy="370" rx="64" ry="28" fill="url(#ruby-lens)"/>
    <ellipse cx="390" cy="365" rx="18" ry="7" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Metal Badge on Bridge -->
  <rect x="270" y="250" width="60" height="30" rx="6" fill="#1c1917" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="300" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#facc15" text-anchor="middle">20x50 HD</text>

  <!-- Inscription -->
  <text x="300" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#78716c" text-anchor="middle">PROFESSIONAL HD BINOCULARS</text>
  <text x="300" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1" fill="#a8a29e" text-anchor="middle">BAK-4 PRISM • NIGHT VISION SUPPORT • WATERPROOF</text>
</svg>
